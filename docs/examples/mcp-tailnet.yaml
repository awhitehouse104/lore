version: 1

repo: /srv/lore/home
listen: 100.64.0.10:8787
endpoint: /mcp

transport:
  request_max_bytes: 8388608
  response_max_bytes: 8388608
  max_concurrent_requests: 8
  request_timeout: 60s
  shutdown_timeout: 15s
  allowed_origins: []
  trust_forwarded_headers: false
  # This is safe only when the bind address is reachable exclusively through
  # an independently encrypted and access-controlled private transport.
  allow_plaintext_non_loopback: true

auth:
  tokens:
    - name: private-tailnet-client
      token_file: /etc/lore/tokens/private-tailnet-client
      permissions:
        - query
        - capture
        - curate
        - inspect
        - history
      sensitivities:
        - normal
        - sensitive

logging:
  format: json
  level: info
  destination: stderr

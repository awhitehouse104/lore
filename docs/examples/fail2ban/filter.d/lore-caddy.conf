[Definition]

# Matches only the minimized JSON emitted by Caddyfile-auth-observability.
# <ADDR> accepts IP addresses only; hostnames and attacker-controlled headers
# are not eligible ban targets.
failregex = ^\{"level":"info",[^,]*,"logger":"http\.log\.access\.lore_auth","msg":"handled request","request":\{"remote_ip":"<ADDR>","uri":"/mcp"\},"status":401\}$

ignoreregex =

# Caddy's ts field is a Unix timestamp with fractional seconds.
datepattern = "ts":{EPOCH}
